name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  boot-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential grub-pc-bin grub-common xorriso mtools qemu-system-x86

      - name: Build
        run: make -j"$(nproc)"

      - name: Boot gate
        timeout-minutes: 5
        run: make test
